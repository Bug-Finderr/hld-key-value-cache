apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-server
  labels:
    app: cache-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-server
  template:
    metadata:
      labels:
        app: cache-server
    spec:
      containers:
      - name: cache-server
        image: cache-server:local
        imagePullPolicy: Never
        ports:
        - containerPort: 7171
          protocol: TCP
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        readinessProbe:
          tcpSocket:
            port: 7171
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7171
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cache-server
  labels:
    app: cache-server
spec:
  type: ClusterIP
  selector:
    app: cache-server
  ports:
  - port: 7171
    targetPort: 7171
    protocol: TCP
